name: Main
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: mbt/server/ui/pnpm-lock.yaml

      - name: Build Web UI
        working-directory: mbt/server/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Build
        run: uv build

      - name: Package skill
        run: |
          (cd .agents/skills && zip -r "${GITHUB_WORKSPACE}/msd-strategy-guide.zip" msd-strategy-guide)

      - name: Publish
        run: uv publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            msd-strategy-guide.zip
            dist/*.whl
          generate_release_notes: true
