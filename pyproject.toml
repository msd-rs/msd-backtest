[project]
name = "msd-backtest"
version = "0.3.1"
description = "MSD backtest framework"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.12"
dependencies = ["numpy>=2.4.2"]

[project.scripts]
mbt-server = "mbt.server.__main__:main"
mbt-run = "mbt.run.cli:main"
mbt-review = "mbt.run.review:main"
mbt-select = "mbt.select.cli:main"
mbt-factor = "mbt.factor.cli:main"
mbt-gui = "mbt.gui.__main__:main"
mbt-doctor = "mbt.doctor:run_doctor"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-benchmark>=5.2.3", "xlrd>=2.0.2"]
excel = ["openpyxl>=3.1.5"]

[project.optional-dependencies]
alpha = ["py-alpha-lib>=0.5.2"]
msd = ["pymsd>=0.1", "polars>=1.0.0", "xlsxwriter>=3.2.9"]
server = ["fastapi[standard]>=0.135.1", "uvicorn>=0.54", "msd-backtest[cli]"]
cli = [
    "orjson>=3.11.9",
    "msd-backtest[alpha,msd]",
    "python-dotenv>=1.2.2",
    "tabulate>=0.10.0",
    "matplotlib>=3.11.2",
]
notify = ["apprise>=2.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = "INFO"
log_cli = true
addopts = "--benchmark-skip"


[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mbt*"]
exclude = ["mbt.server.ui*"]

[tool.setuptools.package-data]
"mbt.server" = ["ui/dist/*", "ui/dist/**/*"]

[tool.uv.sources]
py-alpha-lib = { path = "../alpha-lib-rs/py-binding", editable = true }
pymsd = { path = "../msd-rs2/bindings/python", editable = true }
